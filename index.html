<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英文新聞 · Daily News Digest</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2129;
    --card-hover: #202a35;
    --text: #e8edf2;
    --text-dim: #94a3b3;
    --accent: #4fc3f7;
    --accent-warm: #ffb74d;
    --border: #2b3844;
    --en-bg: #16202a;
    --zh-bg: #1d2833;
    --ok: #66bb6a;
    --bad: #ef5350;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #131a22 0%, var(--bg) 100%);
  }
  header h1 { font-size: 1.5rem; letter-spacing: 1px; }
  header h1 .en { color: var(--accent); font-size: 0.95rem; display: block; margin-top: 4px; font-weight: 400; letter-spacing: 2px; }
  .date-bar {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 14px 20px 6px; flex-wrap: wrap;
  }
  .date-bar .current { font-size: 1.05rem; color: var(--accent-warm); font-weight: 600; }
  .nav-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    text-decoration: none; transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--card-hover); }
  .nav-btn.disabled { opacity: 0.3; pointer-events: none; }
  select.nav-btn { appearance: auto; }
  .tip-note { text-align: center; color: var(--text-dim); font-size: 0.82rem; padding: 0 20px 4px; }
  main { max-width: 780px; margin: 0 auto; padding: 10px 16px 60px; }
  .news-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin: 18px 0; overflow: hidden;
    transition: border-color 0.2s;
  }
  .news-card:hover { border-color: var(--accent); }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px 0;
  }
  .cat-badge {
    font-size: 0.8rem; padding: 3px 10px; border-radius: 20px;
    background: var(--zh-bg); border: 1px solid var(--border); color: var(--text-dim);
    white-space: nowrap;
  }
  .block { padding: 12px 18px; }
  .block.en { background: var(--en-bg); }
  .block.zh { background: var(--zh-bg); border-top: 1px dashed var(--border); }
  .block h2 { font-size: 1.08rem; margin-bottom: 6px; line-height: 1.5; }
  .block.en h2 { color: var(--text); }
  .block.zh h2 { color: var(--accent-warm); }
  .block p { font-size: 0.95rem; color: var(--text-dim); }
  .block.zh p { color: #c3cfda; }
  .card-foot { padding: 10px 18px 14px; background: var(--zh-bg); }
  .card-foot a { color: var(--accent); font-size: 0.88rem; text-decoration: none; word-break: break-all; }
  .card-foot a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  footer { text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 20px; border-top: 1px solid var(--border); }
  footer a { color: var(--accent); text-decoration: none; }

  /* ── 長按查字 ── */
  .w {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
    border-bottom: 1px dotted transparent;
    transition: background 0.1s;
  }
  .w:hover { border-bottom-color: var(--accent); }
  .w.active { background: rgba(79,195,247,0.28); border-radius: 3px; }
  #tip {
    position: fixed; z-index: 99; display: none;
    background: #0c141c; border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 14px; max-width: 300px; font-size: 0.9rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
  }
  #tip .tw { color: var(--accent); font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
  #tip .spk { cursor: pointer; user-select: none; font-size: 0.9rem; }
  #tip .tm { color: var(--accent-warm); font-size: 1rem; }
  #tip .td { color: var(--text-dim); font-size: 0.84rem; margin-top: 4px; line-height: 1.55; }
  #tip .td b { color: #c3cfda; font-weight: 600; }

  /* ── 單字填空 ── */
  .quiz-section {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    margin: 28px 0 10px; padding: 18px;
  }
  .quiz-section > h2 { font-size: 1.15rem; color: var(--accent-warm); margin-bottom: 4px; }
  .q-note { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .quiz-item { padding: 10px 0; border-top: 1px dashed var(--border); }
  .q-sent { font-size: 0.95rem; line-height: 2; }
  .q-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .q-hint { color: var(--text-dim); font-size: 0.84rem; }
  input.blank {
    background: var(--en-bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--accent-warm); font-family: ui-monospace, Menlo, monospace;
    font-size: 0.92rem; text-align: center; padding: 2px 6px; margin: 0 2px;
    vertical-align: baseline;
  }
  input.blank:focus { outline: none; border-color: var(--accent); }
  input.blank.ok { border-color: var(--ok); color: var(--ok); }
  input.blank.bad { border-color: var(--bad); color: var(--bad); }
  input.blank.revealed { border-color: var(--accent); color: var(--accent); }
  .q-reveal, #q-check {
    background: var(--zh-bg); border: 1px solid var(--border); color: var(--text-dim);
    padding: 2px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
  }
  .q-reveal:hover, #q-check:hover { border-color: var(--accent); color: var(--text); }
  #q-check { font-size: 0.9rem; padding: 6px 16px; color: var(--text); }
  .q-mark { font-size: 0.9rem; }
  .q-foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  #q-score { color: var(--accent-warm); font-size: 0.95rem; }
  /* ── 答對彈出帕恰狗／答錯彈出變種吉娃娃 ── */
  #dog, #chi {
    position: fixed; left: 50%; top: 16vh; z-index: 200;
    transform: translateX(-50%);
    display: none; pointer-events: none; text-align: center;
  }
  #dog.show, #chi.show { display: block; animation: dog-pop 3s ease forwards; }
  #dog img, #chi img { display: block; margin: 0 auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5)); }
  #dog img { width: 150px; height: auto; }
  #dog img.card { border-radius: 14px; border: 1px solid var(--border); }
  #chi img { width: 160px; height: auto; border-radius: 14px; border: 1px solid var(--border); }
  #dog .dog-txt, #chi .dog-txt {
    color: var(--accent-warm); font-weight: 700; font-size: 1.05rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); margin-top: 2px;
  }
  #chi .dog-txt { color: #fff; }
  @keyframes dog-pop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.3); }
    10%  { opacity: 1; transform: translateX(-50%) scale(1.12); }
    16%  { transform: translateX(-50%) scale(1); }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
  }

  @media (max-width: 480px) {
    .block h2 { font-size: 1rem; }
    .block p { font-size: 0.9rem; }
  }
</style>
</head>
<body>
<header>
  <h1>📰 每日英文新聞<span class="en">DAILY NEWS DIGEST · EN / 繁中對照</span></h1>
</header>
<div class="date-bar">
  <a class="nav-btn" id="prev-btn">← 前一天</a>
  <span class="current" id="current-date">載入中…</span>
  <a class="nav-btn" id="next-btn">後一天 →</a>
  <select class="nav-btn" id="date-select" title="選擇日期"></select>
</div>
<div class="tip-note">💡 點一下英文單字可查中文翻譯</div>
<main id="news-container">
  <div class="empty">載入中…</div>
</main>
<div id="tip"></div>
<div id="dog" aria-hidden="true">
  <img id="dog-img" src="assets/pochacco.gif" alt="帕恰狗">
  <div class="dog-txt" id="dog-txt">答對了！🎉</div>
</div>
<div id="chi" aria-hidden="true">
  <img src="assets/chihuahua.gif" alt="變種吉娃娃" width="160" height="135">
  <div class="dog-txt">嗯……再想想 🤔</div>
</div>
<footer>
  來源：BBC News / Google News 等公開報導 · 每日 08:00（台北時間）更新<br>
  <a href="https://github.com/tzchia/daily-news">GitHub repo</a>
</footer>
<script>
const CAT_STYLE = {
  "世界": "🌍", "科技": "💻", "財經": "📈", "科技/財經": "💻",
  "羽球": "🏸", "籃球": "🏀", "棒球": "⚾", "運動": "🏅"
};
let dates = [];
let currentIdx = -1;
let QUIZ = [];

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// 把英文單字包成 <span class="w">，跳過已跳脫的 HTML entity
function wrapWords(s) {
  return esc(s).replace(/&[a-zA-Z]+;|[A-Za-z][A-Za-z'’\-]*/g,
    m => m[0] === "&" ? m : `<span class="w">${m}</span>`);
}

async function loadIndex() {
  const res = await fetch("data/index.json?t=" + Date.now());
  dates = (await res.json()).dates.sort().reverse(); // newest first
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  currentIdx = want ? dates.indexOf(want) : 0;
  if (currentIdx < 0) currentIdx = 0;
  buildSelect();
  await loadDay();
}

function buildSelect() {
  const sel = document.getElementById("date-select");
  sel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
  sel.value = dates[currentIdx];
  sel.onchange = () => { currentIdx = dates.indexOf(sel.value); loadDay(); };
}

async function loadDay() {
  const date = dates[currentIdx];
  document.getElementById("current-date").textContent = date;
  document.getElementById("date-select").value = date;
  history.replaceState(null, "", "?date=" + date);

  const prev = document.getElementById("prev-btn");
  const next = document.getElementById("next-btn");
  prev.classList.toggle("disabled", currentIdx >= dates.length - 1);
  next.classList.toggle("disabled", currentIdx <= 0);
  prev.onclick = () => { if (currentIdx < dates.length - 1) { currentIdx++; loadDay(); } };
  next.onclick = () => { if (currentIdx > 0) { currentIdx--; loadDay(); } };

  hideTip();
  const container = document.getElementById("news-container");
  try {
    const res = await fetch(`data/${date}.json?t=` + Date.now());
    const day = await res.json();
    QUIZ = Array.isArray(day.quiz) ? day.quiz : [];
    container.innerHTML = day.items.map(item => {
      const emoji = CAT_STYLE[item.category] || "📄";
      return `<article class="news-card">
        <div class="card-head"><span class="cat-badge">${emoji} ${esc(item.category)}</span></div>
        <div class="block en">
          <h2>${wrapWords(item.title_en)}</h2>
          <p>${wrapWords(item.summary_en)}</p>
        </div>
        <div class="block zh">
          <h2>${esc(item.title_zh)}</h2>
          <p>${esc(item.summary_zh)}</p>
        </div>
        <div class="card-foot">🔗 <a href="${item.url}" target="_blank" rel="noopener">${esc(item.source || item.url)}</a></div>
      </article>`;
    }).join("") + renderQuiz();
  } catch (e) {
    QUIZ = [];
    container.innerHTML = `<div class="empty">找不到 ${date} 的新聞資料</div>`;
  }
}

/* ── 每日單字填空 ── */
function renderQuiz() {
  if (!QUIZ.length) return "";
  const items = QUIZ.map((q, i) => {
    const parts = q.sentence.split(/_{3,}/);
    const width = Math.max(q.word.length, 4) + 2;
    const inputHtml = `<input class="blank" data-i="${i}" maxlength="${q.word.length + 4}"
      style="width:${width}ch" autocapitalize="off" autocomplete="off" spellcheck="false">`;
    const sent = parts.map(p => wrapWords(p)).join(inputHtml);
    return `<div class="quiz-item">
      <div class="q-sent">${i + 1}. ${sent}</div>
      <div class="q-meta">
        <span class="q-hint">💡 ${esc(q.hint_zh)}</span>
        <button class="q-reveal" data-i="${i}">顯示答案</button>
        <span class="q-mark" id="qmark-${i}"></span>
      </div>
    </div>`;
  }).join("");
  return `<section class="quiz-section">
    <h2>📝 今日重點單字填空</h2>
    <p class="q-note">從今日新聞挑出 ${QUIZ.length} 個重點單字，把句子補完整（不分大小寫）。點一下句中其他單字一樣可以查翻譯。</p>
    ${items}
    <div class="q-foot"><button id="q-check">全部對答案</button><span id="q-score"></span></div>
  </section>`;
}

function checkOne(i, quiet) {
  const inp = document.querySelector(`input.blank[data-i="${i}"]`);
  const mark = document.getElementById("qmark-" + i);
  const v = inp.value.trim().toLowerCase();
  inp.classList.remove("ok", "bad");
  if (!v) { mark.textContent = ""; return null; }
  const ok = v === QUIZ[i].word.toLowerCase();
  inp.classList.add(ok ? "ok" : "bad");
  mark.textContent = ok ? "✅" : "❌";
  if (ok && !quiet) { speak(QUIZ[i].word); showDog(); }
  if (!ok && !quiet) showPop(chi);
  return ok;
}

function checkAll() {
  let good = 0, answered = 0;
  QUIZ.forEach((q, i) => { const r = checkOne(i, true); if (r !== null) answered++; if (r) good++; });
  document.getElementById("q-score").textContent = `答對 ${good}/${QUIZ.length}`;
  if (!answered) return; // 全部空白就不彈
  if (good > 0) showDog(); else showPop(chi); // 有答對就出帕恰狗（依累積答對數換裝），全錯才出吉娃娃
}

/* ── 答題彈出動畫（約 3 秒）：答對帕恰狗（依累積答對數升級）、答錯變種吉娃娃 ── */
const dog = document.getElementById("dog");
const chi = document.getElementById("chi");
const dogImg = document.getElementById("dog-img");
const dogTxt = document.getElementById("dog-txt");
/* 累積答對 1–3 題：紅衣帕恰狗；4–6：綠衣比讚；7–9：撅屁股回眸；10 全對：騎耀西 */
const DOG_TIERS = [
  { min: 10, src: "assets/pochacco-yoshi.webp",  txt: "全對！帕恰狗騎耀西出動！🏆" },
  { min: 7,  src: "assets/pochacco-peek.gif",   txt: "太強了！🎊🎉", card: true },
  { min: 4,  src: "assets/pochacco-green.webp",  txt: "答對了！讚讚 👍" },
  { min: 1,  src: "assets/pochacco.gif",         txt: "答對了！🎉" }
];
function countGood() { return document.querySelectorAll("input.blank.ok").length; }
function showDog() {
  const n = countGood();
  const tier = DOG_TIERS.find(t => n >= t.min) || DOG_TIERS[DOG_TIERS.length - 1];
  if (dogImg.getAttribute("src") !== tier.src) dogImg.src = tier.src;
  dogImg.classList.toggle("card", !!tier.card); // 白底圖用圓角卡片樣式
  dogTxt.textContent = tier.txt;
  showPop(dog);
}
function showPop(el) {
  [dog, chi].forEach(x => x.classList.remove("show"));
  void el.offsetWidth; // 重置動畫
  el.classList.add("show");
}
[dog, chi].forEach(el => el.addEventListener("animationend", e => {
  if (e.animationName === "dog-pop") el.classList.remove("show");
}));

const container = document.getElementById("news-container");
container.addEventListener("click", e => {
  if (e.target.classList.contains("q-reveal")) {
    const i = +e.target.dataset.i;
    const inp = document.querySelector(`input.blank[data-i="${i}"]`);
    inp.value = QUIZ[i].word;
    inp.classList.remove("ok", "bad");
    inp.classList.add("revealed");
    document.getElementById("qmark-" + i).textContent = "👁";
    speak(QUIZ[i].word); // 顯示答案同時念出來
  }
  if (e.target.id === "q-check") checkAll();
});
container.addEventListener("keydown", e => {
  if (e.target.classList.contains("blank") && e.key === "Enter") checkOne(+e.target.dataset.i);
});
container.addEventListener("change", e => {
  if (e.target.classList.contains("blank")) checkOne(+e.target.dataset.i);
});

/* ── 長按查字 ── */
const tip = document.getElementById("tip");
let activeW = null;

const POS_ZH = { noun: "名", verb: "動", adjective: "形", adverb: "副",
  preposition: "介", conjunction: "連", pronoun: "代", interjection: "嘆" };

async function fetchTrans(word) {
  const key = "tw1:" + word.toLowerCase();
  const cached = localStorage.getItem(key);
  if (cached) { try { return JSON.parse(cached); } catch (e) {} }
  let out = null;
  try { // Google translate 免費端點（含字典義項）
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&dt=bd&q=" + encodeURIComponent(word));
    if (!r.ok) throw 0;
    const d = await r.json();
    const main = (d[0] && d[0][0] && d[0][0][0]) || "";
    const dict = (d[1] || []).map(en => ({ pos: en[0], terms: (en[1] || []).slice(0, 4) }));
    if (main) out = { main, dict };
  } catch (e) {}
  if (!out) {
    try { // 備援：MyMemory
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|zh-TW");
      const d = await r.json();
      const main = d.responseData && d.responseData.translatedText;
      if (main) out = { main, dict: [] };
    } catch (e) {}
  }
  if (out) { try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) {} }
  return out;
}

function positionTip(el) {
  const rect = el.getBoundingClientRect();
  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
  const above = rect.top - tip.offsetHeight - 8;
  tip.style.top = (above > 8 ? above : rect.bottom + 8) + "px";
}

function speak(word) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => v.lang === "en-US") ||
              speechSynthesis.getVoices().find(v => v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // 預先載入語音清單

async function showTip(el) {
  hideTip();
  activeW = el;
  el.classList.add("active");
  const word = el.textContent.replace(/[^A-Za-z'’\-]/g, "");
  if (!word) { hideTip(); return; }
  speak(word);
  const spk = `<span class="spk" data-w="${esc(word)}" title="發音">🔊</span>`;
  tip.innerHTML = `<div class="tw">${esc(word)} ${spk}</div><div class="td">查詢中…</div>`;
  positionTip(el);
  const t = await fetchTrans(word);
  if (activeW !== el) return; // 已被關掉或換字
  if (!t) {
    tip.innerHTML = `<div class="tw">${esc(word)} ${spk}</div><div class="td">查詢失敗，請檢查網路</div>`;
  } else {
    const dictHtml = t.dict.map(d => {
      const pos = POS_ZH[d.pos] || d.pos || "";
      return `<b>${esc(pos)}</b> ${esc(d.terms.join("、"))}`;
    }).join("<br>");
    tip.innerHTML = `<div class="tw">${esc(word)} ${spk}</div><div class="tm">${esc(t.main)}</div>` +
      (dictHtml ? `<div class="td">${dictHtml}</div>` : "");
  }
  positionTip(el);
}

function hideTip() {
  tip.style.display = "none";
  if (activeW) { activeW.classList.remove("active"); activeW = null; }
}

document.addEventListener("click", e => {
  const w = e.target.closest ? e.target.closest(".w") : null;
  if (!w) { if (!tip.contains(e.target)) hideTip(); return; }
  if (w === activeW) { hideTip(); return; }
  showTip(w);
});
tip.addEventListener("click", e => {
  const s = e.target.closest(".spk");
  if (s) speak(s.dataset.w);
});
window.addEventListener("scroll", hideTip, { passive: true });

loadIndex().catch(() => {
  document.getElementById("news-container").innerHTML =
    '<div class="empty">尚無新聞資料，明天 08:00 後會出現第一份摘要。</div>';
  document.getElementById("current-date").textContent = "—";
});
</script>
</body>
</html>
